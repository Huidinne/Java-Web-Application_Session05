<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách món ăn</title>
</head>
<body>
<h1>Danh sách món ăn</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>
<p th:if="${successMessage}" th:text="${successMessage}" style="color: green;"></p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên món</th>
        <th>Giá</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dish : ${dishes}">
        <td th:text="${dish.id}"></td>
        <td th:text="${dish.name}"></td>
        <td th:text="${#numbers.formatDecimal(dish.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
        <td th:text="${dish.available} ? 'Còn phục vụ' : 'Tạm hết'"></td>
        <td>
            <a th:href="@{|/bai3/edit/${dish.id}|}">Chỉnh sửa</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
